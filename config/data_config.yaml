project:
  data_root: 'E:\qmt_data'
  timezone: Asia/Shanghai
  history_start: '2011-01-01'
  history_fallback_start: '2014-01-01'
  stock_period: 1d
  compression: zstd

storage:
  target_gb: 25
  warning_gb: 30
  hard_limit_gb: 40
  future_project_ceiling_gb: 100
  minimum_free_gb: 10
  batch_safety_factor: 1.25
  qmt_cache_path: null

ingestion:
  initial_batch_size: 100
  max_retries: 3
  retry_backoff_seconds: [5, 30, 120]
  revision_lookback_trade_days: 10
  financial_download_batch_reserve_mb: 256

markets:
  stock_sectors: [沪深京A股, 沪深A股, 京市A股]
  stock_suffixes: [.SH, .SZ, .BJ]
  indexes: [000001.SH, 000002.SH, 000016.SH, 000300.SH, 000905.SH, 000852.SH, 000688.SH, 399006.SZ, 399107.SZ]

futures:
  products: [IF, IH, IC, IM]
  main_rule_version: oi_then_volume_v1
  spot_mapping:
    IH: 000016.SH
    IF: 000300.SH
    IC: 000905.SH
    IM: 000852.SH

financial:
  tables:
    - Balance
    - Income
    - CashFlow
    - Capital
    - HolderNum
    - Top10Holder
    - Top10FlowHolder
    - PershareIndex

volatility:
  annualization_days: 252
  windows: [5, 10, 20, 60, 120]
  min_obs_ratio: 0.80
  percentile_windows: [252, 756]
  percentile_min_obs_ratio: 0.50
  shock_threshold: 2.0
  highvol_percentiles: [0.80, 0.90]
  ewma_halflife: 20
  market_min_coverage_ratio: 0.80
  sector_min_stock_count: 5
  primary_universe: ALL_A
  correlation_windows: [20, 60]
  warmup_safety_days: 20
  index_universe:
    000016.SH: 上证50
    000300.SH: 沪深300
    000905.SH: 中证500
    000852.SH: 中证1000
    000688.SH: 科创50
    399006.SZ: 创业板
